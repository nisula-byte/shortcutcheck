# ShortcutCheck requirements and how each is verified (roadmap step 2.8).
#
# Every requirement names at least one verifier. tests/test_traceability.py fails the build if
# a requirement has none, if a "done" requirement has no test, or if a named test, report or
# roadmap step does not exist.
#
# verified_by entries:
#   test:<file>::<function>   a pytest test in tests/
#   report:<path>             a committed evidence file produced by a CLI command
#   roadmap:<step>            the Check of a roadmap step that is still to come
#   ci:<what>                 the GitHub Actions workflow
#
# status: done (implemented and verified) | planned (Phases 3-4; verified when its step runs)
# priority (MoSCoW): must | should | could

