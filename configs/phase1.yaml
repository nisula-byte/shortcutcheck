# Phase 1 configuration. Every command reads this file; nothing is hard-coded.

seeds: [11, 22, 33, 44, 55]          # rule 5: five fixed seeds, used everywhere

raw_dir: data/raw/dada-v3.1           # where `shortcutcheck data register` extracts the zip
collection_year: 2021                 # dex_date after this year counts as invalid (step 1.5)
android_first_year: 2008              # dex_date before this year counts as invalid (step 1.5)
dex_date_invalid_threshold: 0.20      # >20% invalid -> drop dex_date, use year alone (step 1.5)

# Columns treated as metadata (MR1-MR4 targets). Everything else numeric is behaviour.
# Dada's header contains both "APK size"/"Year" and "apk_size"/"year"; confirm in step 1.4.
metadata_columns:
  - apk_size
  - "APK size"
  - dex_date
  - year
  - "Year"
  - minSdkVersion
  - targetSdkVersion
id_column: sha256

# RQ3 data-sufficiency rule (step 1.4). Dada's ACT14/ACT17 and AZL14/AZL17 names are time
# barriers that cut ONE app pool into training/test parts (ACT14 and ACT17 share ~27k hashes),
# so RQ3 pools a family's apps and selects them by each app's own `year` (= year of dex_date).
# A candidate passes if early and late windows each hold >= the minimum per class.
# Each candidate gives `goodware` + `malware` set globs, or `labelled` globs (.goodmal.csv).
rq3_min_per_class_per_year: 1000
rq3_candidates:
  AndroCT-2014-vs-2017:            # the design as pre-registered in the proposal
    goodware: ACT-G
    malware: ACT-M
    early_years: [2014]
    late_years: [2017]
  AndroCT-2013-14-vs-2017-18:
    goodware: ACT-G
    malware: ACT-M
    early_years: [2013, 2014]
    late_years: [2017, 2018]
  AndroCT-2012-14-vs-2017-19:
    goodware: ACT-G
    malware: ACT-M
    early_years: [2012, 2013, 2014]
    late_years: [2017, 2018, 2019]
  AZL-2014-vs-2017:
    goodware: AZL-G
    malware: AZL-M
    early_years: [2014]
    late_years: [2017]
  AZL-2013-14-vs-2017-18:
    goodware: AZL-G
    malware: AZL-M
    early_years: [2013, 2014]
    late_years: [2017, 2018]

# Frozen splits (step 1.7)
split_seed: 11
rq12_ratios: [0.70, 0.15, 0.15]
rq3_val_fraction: 0.20

# Baselines (step 1.8)
shuffled_label_tolerance: 0.05        # floor for |mean ROC-AUC - 0.5| and |mean PR-AUC - prevalence|
shuffled_permutations: 20             # shuffled-label models; the check tests their mean
mlflow_tracking_uri: sqlite:///mlflow.db   # relative to the project root; MLflow 3 retired the file store
